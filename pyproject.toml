[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vr-compose"
version = "0.1.0"
description = "VR composition toolkit"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "vr.dev", email = "vr.dev@of3d.com" }]
dependencies = [
    "numpy>=2.1",      # 重投影/混合的核心计算
    "pillow>=11.0",    # PNG 编解码
    "pyside6>=6.8",    # GUI（P5）
]

[project.optional-dependencies]
dev = [
    "pyinstaller>=6.10",   # 打包 exe（P6）
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
vr-compose = "vr_compose.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vr_compose"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# tests/ is on sys.path so test modules can import the shared helpers from conftest
pythonpath = ["tests"]
markers = [
    "slow: takes more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "tools"]
mypy_path = ["tests"]
strict = true
warn_unreachable = true
