[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "vr-compose"
version = "0.1.0"
description = "VR composition toolkit"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "vr.dev", email = "vr.dev@of3d.com" }]
dependencies = [
    "numpy>=2.1",      # 重投影/混合的核心计算
    "pillow>=11.0",    # PNG 编解码
    "tqdm>=4.66",      # CLI 进度条
    "pyside6>=6.8",    # GUI（P6）
]

[project.optional-dependencies]
# GPU warp (ROADMAP "可选 — GPU 加速"): opt-in from the CLI only (`--device cuda`), and
# only for an NVIDIA card with 12 GB or more; anything else warns and runs on the CPU.
# The pip wheel finds the CUDA runtime on its own (cuda-pathfinder); tested with 14.2.
gpu = [
    "cupy-cuda12x>=13.4",
    # NVRTC decides which cards work at all, so it is pinned rather than taken from
    # whatever toolkit the machine happens to have. cupy compiles for
    # `min(card, NVRTC ceiling)` and emits SASS, never PTX, and the ceiling is hard-coded
    # per version: 12.0-12.7 stop at sm_90, 12.8 reaches sm_120, 12.9 and later sm_121.
    # A 50-series Blackwell card is compute capability 120, so anything below 12.8 builds
    # it a cubin that will not load. 90 MB, and it is what `--gpu` puts in the bundle.
    "nvidia-cuda-nvrtc-cu12>=12.8",
]
dev = [
    "pyinstaller>=6.10",   # 打包 exe（P8）
    "types-tqdm",          # mypy --strict 需要 tqdm 的 stub
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
vr-compose = "vr_compose.cli:main"
vr-compose-gui = "vr_compose.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vr_compose"]

# The window is loaded from .ui/.qss at runtime (the same pattern VR-Installer uses), so
# they are data, not code, and have to be in the wheel or the GUI cannot start.
[tool.hatch.build.targets.wheel.force-include]
"src/vr_compose/gui/main_window.ui" = "vr_compose/gui/main_window.ui"
"src/vr_compose/gui/style.qss" = "vr_compose/gui/style.qss"
"src/vr_compose/gui/icon.png" = "vr_compose/gui/icon.png"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
# tests/ is on sys.path so test modules can import the shared helpers from conftest
pythonpath = ["tests"]
markers = [
    "slow: takes more than a second",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# The GUI's user-facing strings are Chinese, where full-width punctuation is the correct
# typography rather than a homoglyph mistake -- RUF001 flags it by default, so the
# characters this project actually uses are declared allowed. Add to the list when a new
# one is needed; do not silence the rule, which still catches genuine look-alikes.
allowed-confusables = ["：", "，", "（", "）", "；", "×", "·", "—", "、", "。"]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # flake8-simplify
    "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests", "tools", "main_ui.py"]
mypy_path = ["tests"]
strict = true
warn_unreachable = true
